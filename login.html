<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng Nhập - Gia Tài Của Bạn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4 bg-amber-50">
    <div class="glass-card-light w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-amber-300 flex flex-col gap-4 text-center">
        <span class="text-[10px] font-extrabold text-amber-900 bg-amber-200/80 px-3 py-1 rounded-full uppercase self-center">🏛️ Cổng Xác Thực</span>
        <h1 class="font-serif font-black text-amber-950 text-xl">Gia Tài Của Bạn</h1>
        
        <div class="flex flex-col gap-3 text-left mt-2">
            <div>
                <label class="block text-xs font-bold text-amber-900 mb-1">Tên đăng nhập:</label>
                <input type="text" id="login-username" placeholder="Nhập tên..." class="w-full bg-white/80 border border-amber-300 rounded-xl px-3 py-2 text-sm font-bold text-amber-950 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-amber-900 mb-1">Mật khẩu:</label>
                <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-white/80 border border-amber-300 rounded-xl px-3 py-2 text-sm font-bold text-amber-950 focus:outline-none">
            </div>
            <p id="login-error" class="text-[11px] font-bold text-rose-600 hidden text-center"></p>
        </div>

        <button onclick="handleCloudLogin()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-extrabold rounded-2xl text-xs shadow-md active:scale-95 transition">
            🔑 ĐĂNG NHẬP CLOUD
        </button>

        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-amber-300/60"></div>
            <span class="flex-shrink mx-4 text-amber-800 text-[10px] font-bold uppercase">Hoặc</span>
            <div class="flex-grow border-t border-amber-300/60"></div>
        </div>

        <button onclick="handlePlayOffline()" class="w-full py-3 bg-amber-200/80 hover:bg-amber-300 text-amber-950 font-extrabold rounded-2xl text-xs shadow-sm transition active:scale-95 border border-amber-300">
            👤 CHƠI OFFLINE TRÊN THIẾT BỊ
        </button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjTN4HIUiKNJ_R4iwyEn1ckVyE5bXRJtI",
            authDomain: "hocvienphapsu.firebaseapp.com",
            projectId: "hocvienphapsu",
            storageBucket: "hocvienphapsu.firebasestorage.app",
            messagingSenderId: "266106375389",
            appId: "1:266106375389:web:88212f0c1f88e9ee33df34"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const DOMAIN_SUFFIX = "@giataicuaban.com";

        function handleCloudLogin() {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            if(!u || !p) { document.getElementById('login-error').innerText = "Vui lòng nhập đủ thông tin!"; document.getElementById('login-error').classList.remove('hidden'); return; }
            
            auth.signInWithEmailAndPassword(u.toLowerCase() + DOMAIN_SUFFIX, p)
                .then(() => {
                    localStorage.removeItem('offline_mode');
                    window.location.href = 'index.html';
                })
                .catch(err => {
                    document.getElementById('login-error').innerText = "Sai tài khoản hoặc mật khẩu!";
                    document.getElementById('login-error').classList.remove('hidden');
                });
        }

        function handlePlayOffline() {
            localStorage.setItem('offline_mode', 'true');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
